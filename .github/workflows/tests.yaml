name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: "ubuntu-latest"

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: "actions/checkout@v4"
      - name: Set up Python
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: pytest
